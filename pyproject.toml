[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ragline"
version = "0.1.0"
description = "配置驱动的通用 Python RAG 库"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dengdi", email = "dengdi1803@gmail.com" }]
keywords = ["rag", "llm", "langgraph", "retrieval", "embedding", "chromadb", "bm25"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=0.3,<0.4",
    "langchain-core>=0.3",
    "openai>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5",
]

[project.urls]
Homepage = "https://github.com/dengd1937/ragline"
Repository = "https://github.com/dengd1937/ragline"
Issues = "https://github.com/dengd1937/ragline/issues"
Changelog = "https://github.com/dengd1937/ragline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "syrupy>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2.1",
    "pre-commit>=3.7",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
bge = [
    "FlagEmbedding>=1.2",
    "transformers>=4.44.2,<5",
]
chroma = []
pdf = [
    "pypdf>=4.2",
]
all = [
    "ragline[server,bge,chroma,pdf]",
]

[project.scripts]
ragline = "ragline.server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragline"]

[tool.hatch.build.targets.wheel.force-include]
"src/ragline/py.typed" = "ragline/py.typed"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["FlagEmbedding.*", "chromadb.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not e2e' --cov=ragline --cov-report=term-missing --cov-fail-under=96"
markers = [
    "e2e: marks tests as end-to-end (requires API keys)",
    "slow: marks tests as slow (large data / performance benchmarks)",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260510",
]
